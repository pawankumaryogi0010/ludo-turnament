      <stop offset="0%" style="stop-color:#5B2D8E;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8B5CF6;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="400" height="300" rx="20" fill="url(#bg1)"/>
  <!-- Gift Box -->
